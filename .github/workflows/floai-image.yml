name: floai · openclaw 多架构镜像

# 手动触发：把 fork 当前分支（默认 floai）build 成 amd64+arm64 多架构镜像推 GHCR。
# 各架构用原生 runner 分别 build（避开 QEMU 慢），最后合并成一个 manifest list。
# 触发：Actions 页面点 Run，或 `gh workflow run floai-image.yml -f tag=floai`
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "镜像 tag（推到 ghcr.io/xingguo0127/openclaw:<tag>）"
        required: true
        default: floai

jobs:
  # ── 每个架构在各自原生 runner 上 build，按 digest 推（不带 tag）──
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm # public 仓免费 arm64 原生 runner
            arch: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: 生成小写 GHCR 镜像名
        run: |
          IMAGE_OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${IMAGE_OWNER}/openclaw" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      # default variant build；OPENCLAW_EXTENSIONS 保留 floai 自建能力依赖的插件。
      # ★ qwen 必须显式保留:根 package.json 的 files 里有 `!dist/extensions/qwen/**`
      #   (上游把 qwen 当独立发布的 npm 插件),Docker 的 prune-docker-plugin-dist.mjs 会据此
      #   把 qwen 从镜像 dist 里删掉 —— 而我们在 extensions/qwen 自建了 realtime-voice-provider,
      #   删掉后实时通话起呼必报 "Realtime voice provider \"qwen\" is not registered"。
      #   注意本地 build 不受 files 影响,只有镜像会被 prune,所以本地验通不代表云上可用。
      - name: build + 推 digest（${{ matrix.arch }}）
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          provenance: false
          build-args: |
            OPENCLAW_EXTENSIONS=qwen,perplexity
            OPENCLAW_IMAGE_NPM_PACKAGES=@fly-ai/flyai-cli@1.0.16
            OPENCLAW_INSTALL_BROWSER=1
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: 校验 FlowOS 必需插件（${{ matrix.arch }}）
        run: |
          IMAGE_REF="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker pull "$IMAGE_REF"
          docker run --rm --entrypoint node "$IMAGE_REF" -e \
            "import('/app/dist/extensions/perplexity/index.js').then((plugin) => { if (!plugin.default) throw new Error('perplexity plugin has no default export') })"

      - name: 校验 FlowOS QA Chromium（${{ matrix.arch }}）
        run: |
          IMAGE_REF="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run --rm --entrypoint sh "$IMAGE_REF" -lc '
            set -eu
            chromium_path="$(readlink -f /usr/local/bin/chromium)"
            flowos_path="$(readlink -f /usr/local/bin/flowos-qa-chromium)"
            system_path="$(readlink -f /usr/bin/chromium)"
            test -x "$chromium_path"
            test "$chromium_path" = "$flowos_path"
            test "$chromium_path" = "$system_path"
            test ! -w "$flowos_path"
            test ! -w "$(dirname "$flowos_path")"
            test ! -w /opt
            test ! -w /opt/openclaw
            test ! -w /usr/bin
            test ! -w /usr/local/bin
            /usr/local/bin/flowos-qa-chromium --version

            profile="$(mktemp -d)"
            cleanup() {
              if [ -n "${chromium_pid:-}" ]; then
                kill "$chromium_pid" 2>/dev/null || true
                wait "$chromium_pid" 2>/dev/null || true
              fi
              rm -rf "$profile"
            }
            trap cleanup EXIT INT TERM

            /usr/local/bin/flowos-qa-chromium \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --hide-scrollbars \
              --no-first-run \
              --no-default-browser-check \
              --remote-debugging-port=0 \
              --remote-allow-origins=* \
              --user-data-dir="$profile" \
              about:blank >"$profile/chromium.log" 2>&1 &
            chromium_pid=$!

            for attempt in $(seq 1 100); do
              if ! kill -0 "$chromium_pid" 2>/dev/null; then
                cat "$profile/chromium.log" >&2
                exit 1
              fi
              if [ -s "$profile/DevToolsActivePort" ]; then
                cdp_port="$(sed -n "1p" "$profile/DevToolsActivePort")"
                case "$cdp_port" in
                  *[!0-9]*|"") echo "无效 CDP 端口: $cdp_port" >&2; exit 1 ;;
                esac
                if curl -fsS "http://127.0.0.1:${cdp_port}/json/version" | grep -q '"Browser"'; then
                  exit 0
                fi
              fi
              sleep 0.1
            done

            cat "$profile/chromium.log" >&2
            echo "Chromium CDP 未在 10 秒内就绪" >&2
            exit 1
          '

      - name: 导出 digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" > "/tmp/digests/${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # ── 把两个架构的 digest 合并成一个多架构 tag ──
  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    env:
      JCR_REGISTRY: ${{ secrets.JCR_REGISTRY }} # 京东云端点（空则跳过 JCR）；仓库直接挂注册表下，无额外命名空间
    steps:
      - name: 生成小写 GHCR 镜像名
        run: |
          IMAGE_OWNER="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "IMAGE=ghcr.io/${IMAGE_OWNER}/openclaw" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || github.token }}

      - name: 合并成多架构 manifest
        working-directory: /tmp/digests
        run: |
          TAG="${{ github.event.inputs.tag }}"
          docker buildx imagetools create -t "${IMAGE}:${TAG}" \
            $(for f in *; do echo "${IMAGE}@$(cat "$f")"; done)

      - name: 校验（应列出 linux/amd64 + linux/arm64）
        run: docker buildx imagetools inspect "${IMAGE}:${{ github.event.inputs.tag }}"

      # ── 京东云 JCR：推两个单架构 tag（jfe 网关不收多架构 manifest list，PUT 直接 500/502）──
      #    :<tag>        = amd64 → prod box 内网拉
      #    :<tag>-arm64  = arm64 → 设计师 Apple Silicon 原生拉（dev compose 按 uname -m 选）
      - name: 登录 JCR（京东云）
        if: env.JCR_REGISTRY != ''
        uses: docker/login-action@v3
        with:
          registry: ${{ env.JCR_REGISTRY }}
          username: ${{ secrets.JCR_USER }}
          password: ${{ secrets.JCR_PASS }}

      # 按 digest 拉单架构 manifest 重推（不跑镜像，故 arm64 在 amd64 runner 上也无需 QEMU）。
      # 不合 manifest list：实测 JCR 对 Docker list(500) 与 OCI index(502) 的 PUT 都被网关拒。
      - name: 推单架构 amd64 + arm64 → JCR
        if: env.JCR_REGISTRY != ''
        working-directory: /tmp/digests
        run: |
          set -e
          TAG="${{ github.event.inputs.tag }}"
          JCR_IMG="${JCR_REGISTRY}/openclaw"
          push() {  # $1=GHCR digest  $2=JCR tag
            docker pull "${IMAGE}@$1"
            docker tag  "${IMAGE}@$1" "${JCR_IMG}:$2"
            for n in 1 2 3; do
              if docker push "${JCR_IMG}:$2"; then
                return 0
              fi
              echo "JCR push 失败（${n}/3）" >&2
              [ "$n" -eq 3 ] || sleep 8
            done
            return 1
          }
          AMD64_DIGEST="$(cat amd64)"
          ARM64_DIGEST="$(cat arm64)"
          push "$AMD64_DIGEST" "${TAG}"
          push "$ARM64_DIGEST" "${TAG}-arm64"
          # JCR会把GHCR的OCI manifest重新序列化，跨Registry的manifest digest不会保持一致。
          # docker push成功已证明目标Registry接受镜像；不要把manifest字节级等值当作内容等价。
          echo "✓ JCR: ${JCR_IMG}:${TAG}(amd64) + ${JCR_IMG}:${TAG}-arm64(arm64)"
